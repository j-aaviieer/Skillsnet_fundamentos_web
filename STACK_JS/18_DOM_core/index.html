<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social like</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header>
        <div>
            <h1 class="title">Social Like</h1>
        </div>
        <div>
    </header>
    <main>
        <section class="section-left">
    <div class="tarjeta">
        <div>
            <img src="static/images/misato.png" alt="misato" class="profile-image">
        </div>
        <div>
            <h3>Misato</h3>
        </div>
        <div>
            <button class="profile" onclick="verPerfil()">Mi perfil</button>
        </div>
    </div>
</section>

<section class="section-right">
    <div class="tarjeta-publicaciones">
        <div class="publicaciones-izquierda">
            <h3>Rei</h3>
            <p>Acabo de configurar este nuevo <a href="#">bot de Discord</a>, cuéntame qué opinan ustedes.</p>
        </div>
        <div class="publicaciones-derecha">
            <h4 id="reiLikes">0 like(s)</h4>
            <button class="like-button" id="btnRei">Like</button>
        </div>
    </div>

    <div class="tarjeta-publicaciones">
        <div class="publicaciones-izquierda">
            <h3>Asuka</h3>
            <p>Acabo de leer este <a href="#">nuevo comic</a>. Denle un vistazo.</p>
        </div>
        <div class="publicaciones-derecha">
            <h4 id="asukaLikes">0 like(s)</h4>
            <button class="like-button" id="btnAsuka">Like</button>
        </div>
    </div>

    <div class="tarjeta-publicaciones">
        <div class="publicaciones-izquierda">
            <h3>Shinji</h3>
            <p>No puedo dejar de escuchar este <a href="#">álbum</a>. ¿A quién más le gusta?</p>
        </div>
        <div class="publicaciones-derecha">
            <h4 id="shinjiLikes">0 like(s)</h4>
            <button class="like-button" id="btnShinji">Like</button>
        </div>
    </div>
</section>
    </main>
    <script src="static/js/script.js"></script>
</body>
</html>
