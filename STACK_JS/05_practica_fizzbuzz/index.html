<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica FizzBuzz</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Práctica de FizzBuzz</h1>
        <div class="card">
            <h2>Reglas</h2>
            <p>* Si un número es divisible por 3, muestra “Fizz”.</p>
            <p>* Si un número es divisible por 5, muestra “Buzz”.</p>
            <p>* Si un número es divisible por ambos 3 y 5, muestra “FizzBuzz”.</p>
            <p>* Si no cumple ninguna de estas condiciones, muestra el número tal cual.</p>
            <button onclick="fizzBuzz()">Ejecutar</button>
        </div>
    <script src="static/js/script.js"></script>
</body>
</html>
