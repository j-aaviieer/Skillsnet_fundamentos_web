<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de arte</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <header>
        <div>
            <h1 class="title">The Art Gallery</h1>
        </div>
        <div>
            <input type="text" placeholder="Buscar arte..."></input>
        </div>
        <div>
            <button class="login" id="iniciarSesion">Iniciar sesión</button>
        </div>
    </header>

    <main>
        <section class="main-section">
            <div class="tarjeta" id="tarjeta">
            <img src="static/images/campo-de-trigo-con-cipreses.png" alt="campo-img" class="campo-img">
            <p class="campo-text" id="text">Campo de trigo con cipreses, Vincent van Gogh (1889)</p>
            </div>
        </section>
    </main>

    <script src="static/js/script.js"></script>
</body>
</html>
