<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Javier Colque">
    <title>Desafio con Arreglos js</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Funciones JS</h1>
        <div class="card">
            <h2>Ejemplo 1</h2>
            <p>Funciones sin parametros: saludar </p>
            <button onclick="saludar()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo 2</h2>
            <p>Funciones con parametros: saludar</p>
            <button onclick="saludarParam('Javier')">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo 3</h2>
            <p>Encontrar el numero mayor</p>
            <button onclick="encontrarMayor()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Tarea (Ejemplo4)</h2>
            <p>Sumar a + b y restarlo por c</p>
            <button onclick="mostrarResultado()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Tarea (Ejemplo5)</h2>
            <p>Ingresar un numero y contarlo</p>
            <button onclick="contarNumeros()">Ejecutar</button>
        </div>
    <script src="static/js/script.js"></script>
</body>
</html>
