<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Javier Colque">
    <title>Pagina de Perfil</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="header">
        <h1>Perfil</h1>
        <nav class="buttons">
            <a href="#">Inicio</a>
            <a href="#">Mi perfil</a>
            <a href="#">Conexiones</a>
            <button>Cerrar sesión</button>
        </nav>
    </header>
    <main class="main">
        <section class="perfil">
            <div class="azul"></div>
            <div class="dividiv-jr">
                <img src="static/images/perfil.png" alt="foto">
                <h2>Jane Doe</h2>
                <p class="subtitulo">Bergen, Noruega</p>
                <p class="descripcion">Desarrolladora Frontend</p>
                <p class="descripcion">Conocimientos en HTML, CSS, JavaScript</p>
                <a href="#" class="editar">⚙ Editar perfil</a>
            </div>
        </section>
        <section class="seccion-derecha">
            <div class="right-section">
                <div class="tarjeta-arriba">
                    <div class="titulo-nombres">
                        <h2 class="title-right">Solicitudes de conexión</h2>
                        <button class="blue-button">Ver todas</button>
                    </div>
                    <div class="nombres-arriba">
                        <div class="nombres-top">
                            <div class="names-top">
                                <img src="static/images/perfil.png" alt="foto" class="foto-pequeña">
                                <p class="names">Steve Jobs</p>
                            </div>
                            <div class="buttons-top">
                                <button class="button-yes">✔</button>
                                <button class="button-no">✖</button>
                            </div>
                        </div>
                        <div class="nombres-top">
                            <div class="names-top">
                                <img src="static/images/perfil.png" alt="foto" class="foto-pequeña">
                                <p class="names">Bill Gates</p>
                            </div>
                            <div class="buttons-top">
                                <button class="button-yes">✔</button>
                                <button class="button-no">✖</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tarjeta-abajo">
                    <div class="titulo-nombres">
                        <h2 class="title-right">Tus conexiones</h2>
                        <button class="blue-button">Ver todas</button>
                    </div>
                    <div class="nombres-abajo">
                        <div class="nombres-down">
                            <img src="static/images/perfil.png" alt="foto" class="foto-pequeña">
                            <p class="names">Richard Stallman</p>
                        </div>
                        <div class="nombres-down">
                            <img src="static/images/perfil.png" alt="foto" class="foto-pequeña">
                            <p class="names">Linus Torvalds</p>
                        </div>
                        <div class="nombres-down">
                            <img src="static/images/perfil.png" alt="foto" class="foto-pequeña">
                            <p class="names">Ada Lovelace</p>
                        </div>
                        <div class="nombres-down">
                            <img src="static/images/perfil.png" alt="foto" class="foto-pequeña">
                            <p class="names">Grace Hopper</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
